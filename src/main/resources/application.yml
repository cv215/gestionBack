spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://localhost:3306/dbgestionstock?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    ##specify DBNS
  jpa:
    database: mysql
    show-sql: false
    ##Hibernate ddl auto(create,create-drop, update)
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${PORT:8081}
  servlet:
    context-path: /gestiondestock/v1


app:
  jwt:
    secret-key: ${JWT_SECRET:173b75e3ae41a9a617f2fdc796ffa7d758d0c3a106102fd9b47de56bcac6d749}
  application-time: 900000

logging:
  level:
    org.springframework.security: INFO

